<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%238a6a43%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-family=%27Arial,sans-serif%27 font-size=%2730%27 font-weight=%27700%27 fill=%27%23fff%27 text-anchor=%27middle%27%3EFF%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#f3f1ed">
<title>Furniture Fit · Ren Design bemutató</title>
<style>html,body{height:100%;margin:0;background:#f3f1ed;color:#1d1c1a;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}body{display:grid;place-items:center}</style>
</head>
<body>
<p id="ffLoad">Furniture Fit betöltése…</p>
<script>
/* A bemutató egyetlen HTML-fájl (3D modellekkel együtt ~7,7 MB); itt 4 részben töltődik be, majd a böngésző egyben futtatja. */
(async () => {
  try {
    const N = 4;
    const parts = await Promise.all(Array.from({ length: N }, (_, i) => fetch('app/0eff699158/part' + (i + 1) + '.txt').then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })));
    const html = parts.join('');
    document.open(); document.write(html); document.close();
  } catch (e) {
    document.getElementById('ffLoad').textContent = 'Nem sikerült betölteni a bemutatót. Frissítsd az oldalt, vagy próbáld újra kicsit később.';
  }
})();
</script>
</body>
</html>
