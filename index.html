<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f1ed">
<title>Furniture Fit · Ren Design bemutató</title>
<style>html,body{height:100%;margin:0;background:#f3f1ed;color:#1d1c1a;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}body{display:grid;place-items:center}</style>
</head>
<body>
<p id="ffLoad">Furniture Fit betöltése…</p>
<script>
/* A bemutató egyetlen HTML-fájl (3D modellekkel együtt ~7,7 MB); itt 4 részben töltődik be, majd a böngésző egyben futtatja. */
(async () => {
  try {
    const N = 4;
    const parts = await Promise.all(Array.from({ length: N }, (_, i) => fetch('app/part' + (i + 1) + '.txt').then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })));
    const html = parts.join('');
    document.open(); document.write(html); document.close();
  } catch (e) {
    document.getElementById('ffLoad').textContent = 'Nem sikerült betölteni a bemutatót. Frissítsd az oldalt, vagy próbáld újra kicsit később.';
  }
})();
</script>
</body>
</html>
